name: Deploy to PS7
description: Deploy the ubuntu-com charm to a ProdStack 7 Juju model using JAAS OAuth credentials read from Vault.

inputs:
  image-url:
    description: "Full GHCR image URL to deploy as the flask-app-image resource"
    required: true
  app-name:
    description: "Juju application name"
    required: true
  controller-name:
    description: "Juju controller name"
    required: true
  controller-address:
    description: "Juju controller address for juju login"
    required: true
  model-name:
    description: "Juju model short name"
    required: true
  juju-version:
    description: "Juju snap channel"
    required: false
    default: "3/stable"
  vault-role-id:
    description: "Vault AppRole role id"
    required: true
  vault-secret-id:
    description: "Vault AppRole secret id"
    required: true

runs:
  using: composite
  steps:
    - name: Install Juju
      shell: bash
      env:
        JUJU_VERSION: ${{ inputs.juju-version }}
      run: sudo snap install juju --channel="$JUJU_VERSION"

    - name: Download charm artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: charm

    - name: Fetch JAAS credentials from Vault
      shell: bash
      env:
        VAULT_ADDR: "https://vault.ps7.admin.canonical.com"
        VAULT_ROLE_ID: ${{ inputs.vault-role-id }}
        VAULT_SECRET_ID: ${{ inputs.vault-secret-id }}
        VAULT_SECRET_PATH: groups/canonical-webdesign/service_account
      run: |
        set -euo pipefail
        sudo snap install vault --classic
        VAULT_TOKEN=$(vault write -f -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
        export VAULT_TOKEN
        JUJU_CLIENT_ID=$(vault kv get -mount=secret -field=juju_client_id "$VAULT_SECRET_PATH")
        JUJU_CLIENT_SECRET=$(vault kv get -mount=secret -field=juju_client_secret "$VAULT_SECRET_PATH")
        echo "::add-mask::$JUJU_CLIENT_ID"
        echo "::add-mask::$JUJU_CLIENT_SECRET"
        {
          echo "JUJU_CLIENT_ID=$JUJU_CLIENT_ID"
          echo "JUJU_CLIENT_SECRET=$JUJU_CLIENT_SECRET"
        } >> "$GITHUB_ENV"

    - name: Authenticate with JAAS
      shell: bash
      env:
        JUJU_CONTROLLER_ADDRESS: ${{ inputs.controller-address }}
        JUJU_CONTROLLER_NAME: ${{ inputs.controller-name }}
      run: |
        set -e
        juju login "$JUJU_CONTROLLER_ADDRESS" -c "$JUJU_CONTROLLER_NAME" --debug

    - name: Switch to model
      shell: bash
      env:
        JUJU_CONTROLLER_NAME: ${{ inputs.controller-name }}
        JUJU_MODEL_NAME: ${{ inputs.model-name }}
      run: |
        set -e
        FULL_MODEL=$(juju models -c "$JUJU_CONTROLLER_NAME" --format json | \
          jq -r --arg model "$JUJU_MODEL_NAME" '.models[] | select(.["short-name"] == $model) | .name')
        juju switch "$JUJU_CONTROLLER_NAME:${FULL_MODEL}"

    - name: Deploy charm
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE_URL: ${{ inputs.image-url }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        CHARMS=(./*.charm)
        if [ "${#CHARMS[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one .charm file, found ${#CHARMS[@]}: ${CHARMS[*]}"
          exit 1
        fi
        CHARM_FILE="${CHARMS[0]}"
        # Only deploy when Juju explicitly reports the application as missing;
        # any other failure (API/network/auth error) must not be treated as "absent".
        if SHOW_OUTPUT=$(juju show-application "$APP_NAME" 2>&1); then
          juju refresh "$APP_NAME" --path="$CHARM_FILE" --resource flask-app-image="$IMAGE_URL"
        elif grep -qF "application \"$APP_NAME\" not found" <<< "$SHOW_OUTPUT"; then
          juju deploy "$CHARM_FILE" "$APP_NAME" --resource flask-app-image="$IMAGE_URL"
        else
          echo "::error::Could not determine whether '$APP_NAME' exists: $SHOW_OUTPUT"
          exit 1
        fi
        juju wait-for application "$APP_NAME" --query="name=='$APP_NAME' && (status=='active' || status=='idle')"
