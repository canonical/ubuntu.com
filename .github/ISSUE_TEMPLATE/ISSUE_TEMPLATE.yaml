name: Website issue
description: Report a website bug or content problem, or suggest an improvement
body:
- type: markdown
  attributes:
    value: |
      Use this form for issues with the **ubuntu.com website**, including its
      content and services.

      - For Ubuntu OS, hardware, or software package bugs, [report an Ubuntu
        bug](https://bugs.launchpad.net/ubuntu/).
      - For security vulnerabilities, [submit a private security
        advisory](https://github.com/canonical/ubuntu.com/security/advisories/new).
- type: dropdown
  id: issue_type
  attributes:
    label: Issue type
    description: What kind of issue are you reporting?
    options:
      - Bug
      - Content
      - Improvement
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: Details
    description: Describe the website problem, content correction, or improvement.
    placeholder: |
      What happened, or what would you like to change?
      What did you expect to happen?
      Include any error messages or screenshots that may help.
  validations:
    required: true
- type: input
  id: reported_from
  attributes:
    label: Affected page or URL
    description: Add the relevant ubuntu.com URL, if applicable. It is pre-filled when you use the "Report a bug on this site" link in the site footer.
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: For a bug, list the steps needed to see the problem. Leave blank if not applicable.
    placeholder: |
      1. Go to '...'
      2. Click on '...'
      3. See the problem
- type: textarea
  id: browser
  attributes:
    label: Browser/device details
    description: If relevant, include your browser and version, operating system, and device.
    placeholder: |
      Browser and version:
      Operating system:
      Device:
