name: Clean up stale branches

# Weekly clean-up of branches that are no longer in use:
# - Deletes branches with no commits that aren't already on the default
#   branch.
# - Deletes branches with no open PR and no commits for 90 days.
# - Closes open PRs whose branch has had no commits for 180 days. Their
#   branches are kept (and labelled) so the PR can be reopened.
# Never touches the default branch, protected branches, bot branches,
# branches used as the base of an open PR, or branches named in a workflow.
# Every deleted branch is listed in the job summary with its last commit
# SHA so it can be restored.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted or closed"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: stale-branches
  cancel-in-progress: false

jobs:
  stale-branches:
    if: github.repository == 'canonical/ubuntu.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Delete stale branches and close stale PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const IDLE_BRANCH_DAYS = 90;
            const IDLE_PR_DAYS = 180;
            const MIN_AGE_DAYS = 14;
            const BOT_PREFIXES = ["renovate/", "dependabot/"];
            const CLOSED_LABEL = "auto-closed: stale";
            const COMMENT =
              `Closing this pull request because its branch has had no ` +
              `new commits for over ${IDLE_PR_DAYS} days. The branch has ` +
              `not been deleted.\n\n` +
              `If someone is still working on this, please reopen it.`;

            const dryRun = process.env.DRY_RUN === "true";
            const { owner, repo } = context.repo;
            const DAY = 24 * 60 * 60 * 1000;
            const ageDays = (iso) =>
              Math.floor((Date.now() - Date.parse(iso)) / DAY);

            const { data: repoInfo } = await github.rest.repos.get({
              owner,
              repo,
            });
            const defaultBranch = repoInfo.default_branch;

            const protectedBranches = new Set(
              (
                await github.paginate(github.rest.repos.listBranches, {
                  owner,
                  repo,
                  protected: true,
                  per_page: 100,
                })
              ).map((b) => b.name),
            );

            const openPrBases = new Set(
              (
                await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "open",
                  per_page: 100,
                })
              ).map((p) => p.base.ref),
            );

            // Branch names mentioned in workflows (e.g. deploy targets),
            // including full refs like refs/heads/<name> or origin/<name>.
            let workflowText = "";
            const { data: workflowFiles } = await github.rest.repos.getContent(
              { owner, repo, path: ".github/workflows", ref: defaultBranch },
            );
            for (const file of workflowFiles) {
              if (file.type !== "file") continue;
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: file.path,
                ref: defaultBranch,
              });
              workflowText +=
                Buffer.from(data.content, "base64").toString("utf8") + "\n";
            }
            const escapeRegExp = (s) =>
              s.replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
            const inWorkflows = (name) =>
              new RegExp(
                `(?<![\\w.-])${escapeRegExp(name)}(?![\\w./-])`,
              ).test(workflowText);

            const query = `
              query ($owner: String!, $repo: String!, $base: String!,
                     $label: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  refs(refPrefix: "refs/heads/", first: 50, after: $cursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      name
                      compare(headRef: $base) { behindBy }
                      target { oid ... on Commit { committedDate } }
                      openPrs: associatedPullRequests(
                        states: OPEN, first: 50
                      ) { nodes { number } }
                      autoClosedPrs: associatedPullRequests(
                        labels: [$label], first: 1
                      ) { totalCount }
                    }
                  }
                }
              }`;
            const branches = [];
            let cursor = null;
            do {
              const { repository } = await github.graphql(query, {
                owner,
                repo,
                base: defaultBranch,
                label: CLOSED_LABEL,
                cursor,
              });
              branches.push(...repository.refs.nodes);
              const { hasNextPage, endCursor } = repository.refs.pageInfo;
              cursor = hasNextPage ? endCursor : null;
            } while (cursor);

            const deleted = [];
            const closed = [];
            const failed = [];

            let labelReady = false;
            const ensureLabel = async () => {
              if (labelReady) return;
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: CLOSED_LABEL,
                  color: "cfd3d7",
                  description:
                    "Closed for inactivity; branch kept so it can be reopened",
                });
              } catch (error) {
                if (error.status !== 422) throw error; // already exists
              }
              labelReady = true;
            };

            for (const branch of branches) {
              const { name } = branch;
              const lastCommit = branch.target.committedDate;
              const age = ageDays(lastCommit);
              const openPrs = branch.openPrs.nodes;

              if (
                name === defaultBranch ||
                protectedBranches.has(name) ||
                BOT_PREFIXES.some((prefix) => name.startsWith(prefix)) ||
                openPrBases.has(name) ||
                inWorkflows(name) ||
                age < MIN_AGE_DAYS
              ) {
                continue;
              }

              if (openPrs.length > 0) {
                if (age <= IDLE_PR_DAYS) continue;
                for (const pr of openPrs) {
                  core.info(`Closing #${pr.number} (${name}, ${age} days)`);
                  try {
                    if (!dryRun) {
                      await ensureLabel();
                      await github.rest.issues.addLabels({
                        owner,
                        repo,
                        issue_number: pr.number,
                        labels: [CLOSED_LABEL],
                      });
                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: pr.number,
                        body: COMMENT,
                      });
                      await github.rest.pulls.update({
                        owner,
                        repo,
                        pull_number: pr.number,
                        state: "closed",
                      });
                    }
                    closed.push({ pr: pr.number, name, lastCommit });
                  } catch (error) {
                    failed.push(`#${pr.number}: ${error.message}`);
                  }
                }
                continue;
              }

              // Keep branches of PRs this workflow closed, so they can be
              // reopened.
              if (branch.autoClosedPrs.totalCount > 0) continue;

              const noUniqueCommits = branch.compare?.behindBy === 0;
              if (!noUniqueCommits && age <= IDLE_BRANCH_DAYS) continue;

              const reason = noUniqueCommits
                ? "no unique commits"
                : `no commits for ${age} days`;
              core.info(`Deleting ${name} (${reason})`);
              try {
                if (!dryRun) {
                  const ref = name
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");
                  await github.request(
                    `DELETE /repos/${owner}/${repo}/git/refs/heads/${ref}`,
                  );
                }
                deleted.push({
                  name,
                  sha: branch.target.oid,
                  lastCommit,
                  reason,
                });
              } catch (error) {
                failed.push(`${name}: ${error.message}`);
              }
            }

            const esc = (s) =>
              String(s).replace(/[&<>]/g, (c) => `&#${c.charCodeAt(0)};`);
            const date = (iso) => iso.slice(0, 10);
            const verb = dryRun ? "Would delete" : "Deleted";
            const summary = core.summary.addHeading(
              `Stale branch clean-up${dryRun ? " (dry run)" : ""}`,
            );
            summary.addHeading(`${verb} ${deleted.length} branches`, 3);
            if (deleted.length > 0) {
              summary.addTable([
                [
                  { data: "Branch", header: true },
                  { data: "Last commit", header: true },
                  { data: "Reason", header: true },
                  { data: "SHA", header: true },
                ],
                ...deleted.map((d) => [
                  esc(d.name),
                  date(d.lastCommit),
                  d.reason,
                  d.sha,
                ]),
              ]);
              summary.addRaw(
                "Restore a branch with: <code>gh api " +
                  `repos/${owner}/${repo}/git/refs ` +
                  "-f ref=refs/heads/BRANCH -f sha=SHA</code>",
                true,
              );
            }
            summary.addHeading(
              `${dryRun ? "Would close" : "Closed"} ${closed.length} PRs`,
              3,
            );
            if (closed.length > 0) {
              summary.addTable([
                [
                  { data: "PR", header: true },
                  { data: "Branch", header: true },
                  { data: "Last commit", header: true },
                ],
                ...closed.map((c) => [
                  `#${c.pr}`,
                  esc(c.name),
                  date(c.lastCommit),
                ]),
              ]);
            }
            if (failed.length > 0) {
              summary.addHeading(`Failed (${failed.length})`, 3);
              summary.addList(failed.map(esc));
            }
            await summary.write();

            if (failed.length > 0) {
              core.setFailed(`${failed.length} operations failed`);
            }
