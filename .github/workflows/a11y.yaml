name: a11y check on ubuntu.com

on:
  schedule:
    - cron: "20 7 * * 1" # every Monday at 07:20 UTC
  workflow_dispatch:
permissions:
  contents: read

jobs:
  read-config:
    if: github.repository == 'canonical/ubuntu.com'
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.get-urls.outputs.urls }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read links from test-links.yaml
        id: get-urls
        run: |
          urls=$(yq e '.links[].url' test-links.yaml | tr '\n' ' ' | sed 's/ *$//')
          echo "urls=$urls" >> $GITHUB_OUTPUT
  check-a11y:
    if: github.repository == 'canonical/ubuntu.com'
    runs-on: ubuntu-latest
    needs: read-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "yarn"
      - name: Install dependencies
        run: yarn --frozen-lockfile

      # Retry each URL so a transient failed load (e.g. a 504 on a static
      # asset) doesn't fail the run; real a11y errors fail every attempt
      - name: Run a11y tests
        env:
          URL_LIST: ${{ needs.read-config.outputs.urls }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          MAX_ATTEMPTS: 3
        run: |
          failed=()
          for url in $URL_LIST; do
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if yarn --silent pa11y-ci "$url"; then
                continue 2
              fi
              echo "::warning::$url failed attempt $attempt of $MAX_ATTEMPTS"
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then sleep 10; fi
            done
            failed+=("$url")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed after $MAX_ATTEMPTS attempts: ${failed[*]}"
            exit 1
          fi

      - name: Send message on failure
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        if: failure()
        run: curl -X POST -F "workflow=${GITHUB_WORKFLOW}" -F "repo_name=${GITHUB_REPOSITORY}" -F "action_id=${GITHUB_RUN_ID}" $BOT_URL?room=web-alerts
