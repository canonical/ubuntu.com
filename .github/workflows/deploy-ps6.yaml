name: Deploy to PS6

run-name: Deploy ${{ inputs.commit || inputs.branch || github.ref_name }} (ps6)

# Deployment to ProdStack 6.
# - Push to main / charming-fixes: auto-deploys to staging, then production.
# - Manual dispatch: choose branch, commit and environment (staging, production, both).
# Builds the requested commit once (via pack.yaml) and deploys the same image
# to each environment using Vault-issued Juju credentials.

on:
  push:
    branches:
      - main
      - charming-fixes
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
        default: "main"
      commit:
        description: "Commit SHA to deploy (optional, defaults to tip of branch)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - both
          - staging
          - production
        default: both

concurrency:
  group: deploy-ps6
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pack.yaml
    with:
      ref: ${{ inputs.commit || inputs.branch || github.sha }}

  deploy-staging:
    needs: pack
    if: >-
      ${{ github.event_name == 'push'
      || inputs.environment == 'staging'
      || inputs.environment == 'both' }}
    runs-on:
      [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    permissions:
      contents: read
    environment:
      name: ps6-staging
      url: ${{ vars.WEBSITE_URL }}
    steps:
      - name: Deploy
        uses: ./.github/actions/deploy-ps6
        with:
          image-url: ${{ needs.pack.outputs.image_url }}
          app-name: ${{ vars.CHARM_NAME }}
          controller-name: ${{ vars.JUJU_CONTROLLER_NAME }}
          model-name: ${{ vars.JUJU_MODEL_NAME }}
          vault-role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}

  deploy-production:
    needs: [pack, deploy-staging]
    if: >-
      ${{ !cancelled()
      && needs.pack.result == 'success'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      && (github.event_name == 'push' || inputs.environment == 'production' || inputs.environment == 'both') }}
    runs-on:
      [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    permissions:
      contents: read
    environment:
      name: ps6-production
      url: ${{ vars.WEBSITE_URL }}
    steps:
      - name: Deploy
        uses: ./.github/actions/deploy-ps6
        with:
          image-url: ${{ needs.pack.outputs.image_url }}
          app-name: ${{ vars.CHARM_NAME }}
          controller-name: ${{ vars.JUJU_CONTROLLER_NAME }}
          model-name: ${{ vars.JUJU_MODEL_NAME }}
          vault-role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
