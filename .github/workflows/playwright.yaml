name: Playwright Tests
env:
  SECRET_KEY: insecure_test_key
  PORT: 8001
  CONTRACTS_API_URL: https://contracts.staging.canonical.com
  STRIPE_PUBLISHABLE_KEY: pk_test_yndN9H0GcJffPe0W58Nm64cM00riYG4N46
  CAPTCHA_TESTING_API_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI

on:
  pull_request:
    branches: [ main ]

jobs:
  run-playwright:
    if: github.repository == 'canonical/ubuntu.com'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: yarn install --immutable

    - name: Install dotrun
      run: sudo pip3 install dotrun

    - name: Install dependencies
      run: |
        sudo chmod -R 777 .
        dotrun install

    - name: Replay recorded Discourse responses
      # CI has no Discourse credentials, so /engage is served from a VCR
      # cassette. See "Playwright cassette" in HACKING.md to re-record it.
      run: echo "GUNICORN_CMD_ARGS=-c tests/playwright/cassette.py" >> .env.local

    - name: Disable Flask debug mode for the test server
      # FLASK_DEBUG defaults to true (.env), which makes `entrypoint` start
      # gunicorn with `--timeout 9999`. Pages that hit live, uncached
      # endpoints (e.g. public Discourse docs requests not covered by the
      # cassette above) can then wedge a worker forever instead of being
      # killed and respawned, eventually hanging every request - including
      # unrelated ones - until the whole Playwright run times out. TESTING
      # keeps the /tests/<path> routes registered without debug mode.
      run: |
        echo "FLASK_DEBUG=false" >> .env.local
        echo "TESTING=true" >> .env.local

    - name: Build assets and run dotrun
      run: |
        dotrun > dotrun.log 2>&1 & sleep 5
          curl --head --fail --retry-delay 2 --retry 30 --retry-connrefused http://localhost:8001

    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps

    - name: Run Playwright tests
      env:
        PLAYWRIGHT_USER_ID: ${{ secrets.PLAYWRIGHT_USER_ID }}
        PLAYWRIGHT_USER_PASSWORD : ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
        TESTING: true
      run: yarn playwright test

    - name: Show server log
      if: failure()
      run: cat dotrun.log
