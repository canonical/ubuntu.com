name: docs links on ubuntu.com/ceph/docs

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install linkchecker
        run: sudo pip install LinkChecker

      - name: Run linkchecker with retry for transient failures
        run: bash scripts/check-links.sh .linkchecker/ceph-docs-links/linkcheckerrc https://ubuntu.com/ceph/docs

      - name: Send message on failure
        if: failure()
        run: |
          curl -X POST \
            -F "workflow=${GITHUB_WORKFLOW}" \
            -F "repo_name=${GITHUB_REPOSITORY}" \
            -F "action_id=${GITHUB_RUN_ID}" \
            ${{ secrets.BOT_URL }}?room=docs
