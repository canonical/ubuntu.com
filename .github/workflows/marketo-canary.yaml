name: Marketo form submission canary
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: marketo-canary
  cancel-in-progress: false

jobs:
  marketo-canary:
    if: github.repository == 'canonical/ubuntu.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      - name: Submit canary forms on ubuntu.com
        env:
          PLAYWRIGHT_BASE_URL: https://ubuntu.com
          INCLUDE_CANARY: true
          CI: true
        run: yarn playwright test canary --reporter=line,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketo-canary-report
          path: playwright-report/
          retention-days: 7

      - name: Get previous run result
        id: previous
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          ALERT_EVERY_FAILED: 6
        run: |
          if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/marketo-canary.yaml/runs?status=completed&branch=${BRANCH}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion=="success" or .conclusion=="failure") | .conclusion]'); then
            # Lookup failed, alert rather than stay silent
            echo "notify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Consecutive failures before this run, since the last success
          streak=$(jq 'index("success") // length' <<< "$runs")
          notify=false
          if (( (streak + 1) % ALERT_EVERY_FAILED == 0 )); then notify=true; fi
          recovered=false
          if (( streak >= ALERT_EVERY_FAILED )); then recovered=true; fi

          echo "notify=${notify}" >> "$GITHUB_OUTPUT"
          echo "recovered=${recovered}" >> "$GITHUB_OUTPUT"

      - name: Send message on repeated failures
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        if: failure() && steps.previous.outputs.notify == 'true'
        run: curl -X POST -F "workflow=${GITHUB_WORKFLOW}" -F "repo_name=${GITHUB_REPOSITORY}" -F "action_id=${GITHUB_RUN_ID}" $BOT_URL?room=web-alerts

      - name: Send message on recovery
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        if: success() && steps.previous.outputs.recovered == 'true'
        run: |
          message="[${GITHUB_WORKFLOW}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) recovered"
          encoded=$(jq -rn --arg m "$message" '$m | @uri')
          curl -X POST "${BOT_URL}?room=web-alerts&custom_message=${encoded}"