name: Bandit

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1" # every Monday at 07:20 UTC

jobs:
  analyze:
    # bandit-action v1.0.1 hardcodes Python 3.9, which has no build for
    # ubuntu-latest (26.04). Move back once a release lets us pick the
    # version: https://github.com/PyCQA/bandit-action/issues/48
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f # v1.0.1
        with:
          # Action defaults, plus unit tests (asserts and fake credentials
          # are expected there) and charm/lib, which is vendored from
          # Charmhub via `charmcraft fetch-lib` and must not be edited.
          exclude: .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg,./tests,./charm/lib

      - name: Send message on failure
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        if: failure()
        run: curl -X POST -F "workflow=${GITHUB_WORKFLOW}" -F "repo_name=${GITHUB_REPOSITORY}" -F "action_id=${GITHUB_RUN_ID}" $BOT_URL?room=web-alerts
