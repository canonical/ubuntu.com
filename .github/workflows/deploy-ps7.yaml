name: Deploy to PS7

run-name: Deploy ${{ inputs.commit || inputs.branch || github.ref_name }} (ps7)

# Deployment to ProdStack 7.
# - Push to main / WD-38425-set-up-continuous-deployment-for-ubuntu-com-on-ps-7: auto-deploys to staging, then production.
# - Manual dispatch: choose branch, commit and environment (staging, production, both).
# Builds the requested commit once (via pack.yaml) and deploys the same image
# to each environment using JAAS OAuth credentials.

on:
  push:
    branches:
      - main
      - WD-38425-set-up-continuous-deployment-for-ubuntu-com-on-ps-7 # remove after testing
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
        default: "main"
      commit:
        description: "Commit SHA to deploy (optional, defaults to tip of branch)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - both
          - staging
          - production
        default: both

concurrency:
  group: deploy-ps7
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pack.yaml
    with:
      ref: ${{ inputs.commit || inputs.branch || github.sha }}

  deploy-staging:
    needs: pack
    if: >-
      ${{ github.event_name == 'push'
      || inputs.environment == 'staging'
      || inputs.environment == 'both' }}
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-medium]
    permissions:
      contents: read
    environment:
      name: ps7-staging
      url: ${{ vars.WEBSITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        uses: ./.github/actions/deploy-ps7
        with:
          image-url: ${{ needs.pack.outputs.image_url }}
          app-name: ${{ vars.CHARM_NAME }}
          controller-name: ${{ vars.JUJU_CONTROLLER_NAME }}
          controller-address: ${{ vars.JUJU_CONTROLLER_ADDRESS }}
          model-name: ${{ vars.JUJU_MODEL_NAME }}
          juju-version: ${{ vars.JUJU_VERSION || '3/stable' }}
          juju-client-id: ${{ secrets.JUJU_CLIENT_ID }}
          juju-client-secret: ${{ secrets.JUJU_CLIENT_SECRET }}

  deploy-production:
    needs: [pack, deploy-staging]
    if: >-
      ${{ !cancelled()
      && needs.pack.result == 'success'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      && (github.event_name == 'push' || inputs.environment == 'production' || inputs.environment == 'both') }}
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-medium]
    permissions:
      contents: read
    environment:
      name: ps7-production
      url: ${{ vars.WEBSITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        uses: ./.github/actions/deploy-ps7
        with:
          image-url: ${{ needs.pack.outputs.image_url }}
          app-name: ${{ vars.CHARM_NAME }}
          controller-name: ${{ vars.JUJU_CONTROLLER_NAME }}
          controller-address: ${{ vars.JUJU_CONTROLLER_ADDRESS }}
          model-name: ${{ vars.JUJU_MODEL_NAME }}
          juju-version: ${{ vars.JUJU_VERSION || '3/stable' }}
          juju-client-id: ${{ secrets.JUJU_CLIENT_ID }}
          juju-client-secret: ${{ secrets.JUJU_CLIENT_SECRET }}
