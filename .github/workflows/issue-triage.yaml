name: Issue triage

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check new issue
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Serialise with the reply job so an issue is never labelled
    # "Automation: issue needs info" after the author has already responded
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Field labels and issue type options below must match
            // .github/ISSUE_TEMPLATE/ISSUE_TEMPLATE.yaml
            const labels = [
              "Issue type",
              "Details",
              "Affected page or URL",
              "Steps to reproduce",
              "Browser/device details",
            ];
            const body = (context.payload.issue.body || "").replace(/\r\n/g, "\n");
            const typeAnswer =
              /^### Issue type[ \t]*\n\s*(Bug|Content|Improvement)[ \t]*$/m;
            const type = body.match(typeAnswer)?.[1] ?? null;

            // Judge everything the reporter wrote, wherever they wrote it, so
            // deleting or reusing the form's sections is never penalised
            const headings = new RegExp(`^### (${labels.join("|")})[ \\t]*$`, "gm");
            const written = body
              .replace(typeAnswer, "")
              .replace(headings, "")
              .replace(/^_No response_$/gm, "");
            const words = written.split(/\s+/).filter(Boolean).length;
            const hasAttachment =
              /!\[[^\]]*\]\(|<img\s|github\.com\/user-attachments\//i.test(body);

            const issue = { ...context.repo, issue_number: context.issue.number };

            if (words < 2 && !hasAttachment) {
              await github.rest.issues.createComment({
                ...issue,
                body:
                  "Thanks for opening this issue. It has been closed because " +
                  "the description is blank or only one word. Please comment " +
                  "with the details and a maintainer will reopen it.",
              });
              await github.rest.issues.update({
                ...issue,
                state: "closed",
                state_reason: "not_planned",
              });
              return;
            }

            // A page counts as identified if the text mentions ubuntu.com,
            // any URL, or a relative path like /desktop/download
            const mentionsPage = (text) =>
              /(^|[^\w.-])([\w-]+\.)*ubuntu\.com\b/i.test(text) ||
              /https?:\/\/\S+/i.test(text) ||
              /(^|\s)\/[\w.-]+\/\S*/.test(text);
            const hasUrl =
              mentionsPage(body) ||
              /^### Affected page or URL[ \t]*\n\s*\/\S/m.test(body);

            // Only ask when the reporter chose a type that needs a page
            if ((type === "Bug" || type === "Content") && !hasUrl) {
              // The author may have added the URL by editing the issue or
              // commenting while this run was queued, before the label
              // existed, so the reply job never saw it. Re-read the live
              // issue and their comments before retaining the label.
              const { data: current } = await github.rest.issues.get({
                ...context.repo,
                issue_number: context.issue.number,
              });
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: context.issue.number,
              });
              const answered =
                mentionsPage(current.body || "") ||
                comments
                  .filter((c) => c.user.login === current.user.login)
                  .some((c) => mentionsPage(c.body || ""));
              if (answered) return;

              await github.rest.issues.createComment({
                ...issue,
                body:
                  "Thanks for reporting this. To help us look into it, please " +
                  "edit the issue or comment with the ubuntu.com page this " +
                  "relates to, for example `https://ubuntu.com/desktop/download`." +
                  "\n\nIf there is no response within 7 days, this issue will " +
                  "be closed automatically.",
              });
              await github.rest.issues.addLabels({
                ...issue,
                labels: ["Automation: issue needs info"],
              });
            }

  author-responded:
    name: Clear needs-info on reply
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'Automation: issue needs info') &&
      github.event.sender.login == github.event.issue.user.login &&
      (github.event_name == 'issue_comment' ||
       (github.event.action == 'edited' && github.event.changes.body))
    runs-on: ubuntu-latest
    # Serialise with the check job (same per-issue group)
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name: "Automation: issue needs info",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  close-stale:
    name: Close issues still needing info
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          only-issue-labels: "Automation: issue needs info"
          stale-issue-label: "Automation: stale issue"
          days-before-issue-stale: 7
          days-before-issue-close: 0
          days-before-pr-stale: -1
          days-before-pr-close: -1
          close-issue-reason: not_planned
          close-issue-message: >-
            This issue has been closed because the requested details weren't
            added within 7 days. If this is still a problem, comment with the
            details and a maintainer will reopen it.
