{# Local fonts, at the end of <head> so they override Vanilla's and use the preloaded URLs #}
<style>
  @font-face {
    font-family: "Ubuntu variable";
    font-stretch: 100%;
    font-style: normal;
    font-weight: 100 800;
    src: url("{{ versioned_static('fonts/ubuntu-variable-latin.woff2') }}") format("woff2");
  }

  @font-face {
    font-family: "Ubuntu variable";
    font-stretch: 100%;
    font-style: italic;
    font-weight: 100 800;
    src: url("{{ versioned_static('fonts/ubuntu-variable-latin-italic.woff2') }}") format("woff2");
  }

  @font-face {
    font-family: "Ubuntu Mono variable";
    font-style: normal;
    font-weight: 100 800;
    src: url("{{ versioned_static('fonts/ubuntu-mono-variable.woff2') }}") format("woff2");
  }
</style>
