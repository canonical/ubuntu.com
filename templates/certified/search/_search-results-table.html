<div class="p-accordion p-certification-results"
     data-multiple-expanded="true">
  <ul class="p-accordion__list">
    {% for group in grouped_results %}
      <li class="p-accordion__group">
        <div class="p-certification-results__heading"
             role="heading"
             aria-level="2">
          <button type="button"
                  class="p-accordion__tab"
                  id="config-tab-{{ group.platform_id }}"
                  aria-controls="config-panel-{{ group.platform_id }}"
                  aria-expanded="false">
            <span class="p-heading--5">{{ group.label }}</span>
          </button>
          {% if group.details_url %}
            <a class="p-certification-results__details-link"
               href="{{ group.details_url }}">View full model details<i class="p-icon--arrow-top-right"></i></a>
          {% endif %}
        </div>
        <section class="p-accordion__panel"
                 id="config-panel-{{ group.platform_id }}"
                 aria-hidden="true"
                 aria-labelledby="config-tab-{{ group.platform_id }}">
          <ul class="p-certification-results__configurations">
            {% for configuration in group.configurations %}
              <li>
                <a href="/certified/{{ configuration.canonical_id }}">{{ configuration.summary }}</a>
              </li>
            {% endfor %}
          </ul>
        </section>
      </li>
    {% endfor %}
  </ul>
</div>
