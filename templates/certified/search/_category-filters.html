<section class="p-accordion__panel is-dense" id="tab1-section" aria-hidden="false" aria-labelledby="tab1">
	<!-- filters state storage -->
	<label class="p-checkbox">
		<!-- values match API form factors -->
		<input id="laptops" type="checkbox" data-filter="laptops" class="p-checkbox__input" name="category" value="Laptop" {% if "Laptop" in request.args.getlist("category") %}checked{% endif %} />
		<span class="p-checkbox__label">Laptop</span>
	</label>
	<label class="p-checkbox">
		<input id="desktops" type="checkbox" data-filter="desktops" class="p-checkbox__input" name="category" value="Desktop" {% if "Desktop" in request.args.getlist("category") %}checked{% endif %} />
		<span class="p-checkbox__label">Desktop</span>
	</label>
	<label class="p-checkbox">
		<input id="servers" type="checkbox" data-filter="servers" class="p-checkbox__input" name="category" value="Server" {% if "Server" in request.args.getlist("category") %}checked{% endif %} />
		<span class="p-checkbox__label">Server</span>
	</label>
	<label class="p-checkbox">
		<input id="iot" type="checkbox" data-filter="smart_core" class="p-checkbox__input" name="category" value="IoT" {% if "IoT" in request.args.getlist("category") %}checked{% endif %} />
		<span class="p-checkbox__label">IoT</span>
	</label>
	<label class="p-checkbox">
		<input id="socs" type="checkbox" data-filter="soc" class="p-checkbox__input" name="category" value="SoC" {% if "SoC" in request.args.getlist("category") %}checked{% endif %} />
		<span class="p-checkbox__label">SoC</span>
	</label>
</section>
