{#
  A "Built by you" tile showing its image. With a "video" dict ({"webm": AV1
  url, "hevc": url, "mp4": H.264 url}) the tiles script swaps the image for a
  muted looping <video>, using it as the poster. Browsers take the first
  source whose codec they can decode. Uses image(), so import with context.
#}
{% macro community_tile(tile) -%}
  <article class="p-community-tile{% if tile.is_square %} is-square{% endif %}">
    <div class="p-community-tile__frame">
      {{ image(url=tile.image.url,
              alt="",
              width=tile.image.width,
              height=tile.image.height,
              hi_def=True,
              loading="lazy",
              attrs={"class": "p-community-tile__media"}) | safe
      }}
      {%- if tile.video %}
        {# Without JS browsers force native controls on a video, so it waits
           here until the tiles script swaps it in #}
        <template class="js-community-video">
          <video class="p-community-tile__media"
                 muted
                 loop
                 playsinline
                 preload="none"
                 aria-hidden="true">
            <source src="{{ tile.video.webm }}" type='video/webm; codecs="av01.0.08M.08"' />
            <source src="{{ tile.video.hevc }}" type='video/mp4; codecs="hvc1.1.6.L120.B0"' />
            <source src="{{ tile.video.mp4 }}" type="video/mp4" />
          </video>
        </template>
      {%- endif %}
    </div>
    <div class="p-community-tile__content">
      <h3 class="p-heading--5 u-no-padding--top">{{ tile.title }}</h3>
      {# Wrapped so the overlay can push the text and button to the bottom #}
      <div>
        <p>{{ tile.body }}</p>
        <a class="p-button u-no-margin--bottom" href="{{ tile.button.href }}">{{ tile.button.text }}</a>
      </div>
    </div>
  </article>
{%- endmacro %}
