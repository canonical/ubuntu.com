{# Built by you. For you.: real videos pending HP-18 (assets on assets.ubuntu.com) #}
{% from "_macros/shared/vf_section_top_rule.jinja" import vf_section_top_rule %}

{#-
  A tile with a "video" dict ({"webm": url, "mp4": url}) renders a <video> with
  the image as its poster; without one it renders the image. Media until HP-18
  lands are placeholder photos.
-#}
{% set tiles = [
  {
    "title": "Join us in making software freely available to all",
    "body": "Our community members are the beating heart of Ubuntu. We welcome both code and non-code contributions from around the world. Join us in shaping the future of Ubuntu – you’ll be sure to receive a warm welcome.",
    "button": {"text": "Join the community", "href": "/community"},
    "image": {"url": "https://assets.ubuntu.com/v1/6feb3ff1-community-booths.jpg", "width": "1200", "height": "800"},
    "video": none,
    "is_square": true
  },
  {
    "title": "Discover the Ubuntu Summit",
    "body": "Twice a year, we put on a virtual showcase of the most exciting open source projects, from across industries. Stay up to date with the next summit to ensure you don’t miss a beat – and be sure to consider contributing a talk.",
    "button": {"text": "Learn about the Ubuntu Summit", "href": "/summit"},
    "image": {"url": "https://assets.ubuntu.com/v1/b129df29-community.jpg", "width": "2048", "height": "807"},
    "video": none,
    "is_square": false
  },
  {
    "title": "Our contributions",
    "body": "As a company committed to open source, Canonical makes contributions to upstream projects, ensuring that our impact goes beyond Ubuntu and helps sustain open source as a whole.",
    "button": {"text": "Find out more", "href": "#"},
    "image": {"url": "https://assets.ubuntu.com/v1/33033ff9-new-speaker-img-1.jpg", "width": "1832", "height": "1030"},
    "video": none,
    "is_square": false
  }
] %}

{% macro community_tile(tile) -%}
  <article class="p-community-tile{% if tile.is_square %} is-square{% endif %}">
    <div class="p-community-tile__frame">
      {%- if tile.video %}
        {%- set poster = image(url=tile.image.url,
                alt="",
                width="1200",
                hi_def=False,
                output_mode="attrs") %}
        <video class="p-community-tile__media"
               muted
               loop
               playsinline
               preload="none"
               poster="{{ poster.src }}"
               aria-hidden="true">
          <source src="{{ tile.video.webm }}" type="video/webm" />
          <source src="{{ tile.video.mp4 }}" type="video/mp4" />
        </video>
      {%- else %}
        {{ image(url=tile.image.url,
                alt="",
                width=tile.image.width,
                height=tile.image.height,
                hi_def=True,
                loading="lazy",
                attrs={"class": "p-community-tile__media"}) | safe
        }}
      {%- endif %}
    </div>
    <div class="p-community-tile__content">
      <h3 class="p-heading--5 u-no-padding--top p-community-tile__title">{{ tile.title }}</h3>
      <div class="p-community-tile__details">
        <p>{{ tile.body }}</p>
        <a class="p-button u-no-margin--bottom" href="{{ tile.button.href }}">{{ tile.button.text }}</a>
      </div>
    </div>
  </article>
{%- endmacro %}

<section class="p-section js-community-tiles">
  <div class="grid-row--50-50-on-large">
    {{ vf_section_top_rule() }}
    <div class="grid-col">
      <h2>Built by you. For you.</h2>
    </div>
    <div class="grid-col">
      <p>
        Our community doesn’t just use Ubuntu: they build it. See how you can contribute to the latest innovations in the ecosystem.
      </p>
      <p class="u-text--muted p-community__hint">Hover over the media below to see more.</p>
    </div>
  </div>
  <div class="grid-row p-community__tiles">
    <div class="grid-col-4 grid-col-medium-4">{{ community_tile(tiles[0]) }}</div>
    <div class="grid-col-4 grid-col-medium-4 p-community__stack">
      {{ community_tile(tiles[1]) }}
      {{ community_tile(tiles[2]) }}
    </div>
  </div>
</section>
