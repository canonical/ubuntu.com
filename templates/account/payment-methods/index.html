{% extends "advantage/base_advantage.html" %}

{% block title %}Canonical payment method{% endblock %}

{% block meta_description %}Mange your payment method for your Canonical services.{% endblock %}

{% block head_extra %}<meta name="robots" content="noindex, nofollow" />{% endblock %}

{% block content %}

     <div id="account-pages-app"
       data-stripe-key="{{ get_stripe_publishable_key }}"
       data-account-id="{{ account_id }}"
       data-pending-purchase-id="{{ pending_purchase_id }}"
       data-has-payment-method="{{ 'true' if default_payment_method and default_payment_method.id else 'false' }}"
       data-card-brand="{{ default_payment_method.brand if default_payment_method else '' }}"
       data-card-last4="{{ default_payment_method.last4 if default_payment_method else '' }}"></div>

  <script nonce="{{ csp_nonce }}" src="https://js.stripe.com/v3/"></script>

  <script nonce="{{ csp_nonce }}" src="{{ versioned_static('js/dist/ua-payment-methods.js') }}"
          type="module"
          defer></script>

{% endblock content %}
